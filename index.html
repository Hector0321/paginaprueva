<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Página de Inicio Nocturna</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: #0d0d1a;
      color: #e0e0ff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #1a1a2e;
      padding: 1em 0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1em;
    }

    nav a {
      font-family: 'Orbitron', sans-serif;
      color: #00ffff;
      text-decoration: none;
      padding: 0.7em 1.2em;
      border-radius: 10px;
      background-color: #2c2c54;
      transition: background 0.3s, transform 0.2s;
    }

    nav a:hover {
      background-color: #00ffff;
      color: #0d0d1a;
      transform: scale(1.05);
    }

    .contenido {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 3em 2em;
      max-width: 1200px;
      margin: auto;
    }

    .texto {
      flex: 1;
      min-width: 280px;
      padding: 1.5em;
    }

    .texto h1 {
      font-size: 2.8em;
      font-family: 'Orbitron', sans-serif;
      color: #00ffff;
      margin-bottom: 0.5em;
    }

    .texto p {
      font-size: 1.2em;
      color: #ccccff;
      margin-bottom: 1.5em;
    }

    .boton {
      display: inline-block;
      background: linear-gradient(45deg, #ff00cc, #3333ff);
      color: white;
      text-decoration: none;
      padding: 1em 2em;
      font-size: 1em;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(255, 0, 204, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .boton:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(255, 0, 204, 0.7);
    }

    .imagen {
      flex: 1;
      min-width: 280px;
      text-align: center;
      padding: 1.5em;
    }

    .imagen img {
      max-width: 100%;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
    }

    @media (max-width: 768px) {
      .texto h1 {
        font-size: 2em;
        text-align: center;
      }

      nav {
        gap: 0.8em;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html">INICIO</a>
      <a href="Pagina1/index.html">PÁGINA 1</a>
      <a href="Pagina2/index.html">PÁGINA 2</a>
      <a href="Pagina3/index.html">PÁGINA 3</a>
      <a href="Pagina4/index.html">PÁGINA 4</a>
     <a href="Pagina5/index.html">Host local</a>
     <a href="Pagina6/Index.html">Página estática</a>
    <a href="Pagina7/curriculun.pdf">curriculun</a>




    </nav>
  </header>

  <section class="contenido">
    <div class="texto">
      <h1>Página Inicial</h1>
      <p>Bienvenido. Esta es la página de inicio. Usa el menú para explorar las secciones del sitio web.</p>
      <a href="pagina1.html" class="boton">Ir a Página 1</a>
    </div>
    <div class="imagen">
      <img src="https://images.unsplash.com/photo-1518770660439-4636190af475" alt="Persona usando laptop">
    </div>
  </section>

</body>
</html>
